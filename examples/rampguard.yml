# Rampguard policy. Lives at .github/rampguard.yml in the app repository.
app: com.example.app
stages: [1, 5, 20, 50, 100]    # percent; the first is set by a human at submission, the last must be 100
notify:                        # optional; without it, events go to the job log and summary only
  slackWebhookEnv: SLACK_WEBHOOK_URL  # name of the secret/env var holding the incoming webhook URL
