name: Rampguard Play Rollout
description: Steps a Google Play staged rollout to its next stage on a schedule; halts it on command.
author: savvasg28

branding:
  icon: trending-up
  color: green

inputs:
  command:
    description: One of tick, halt, status, validate.
    required: true
  config:
    description: Path to rampguard.yml in the repository.
    default: .github/rampguard.yml
  play-credentials:
    description: >-
      Google service-account key JSON (store it as a repository secret). Needed by tick, halt and status.
      Alternatively authenticate with google-github-actions/auth before this step and leave this empty.
    default: ""
  version-code:
    description: For halt, the versionCode of the release to halt. Non-digits are stripped, so a tag value like version_code:101 works.
    default: ""
  reason:
    description: For halt, why. Recorded in the audit and the outputs.
    default: manual
  source:
    description: For halt, who or what asked.
    default: ""
  dry-run:
    description: Decide and report, but write nothing to Play. Use it once to check the install.
    default: "false"
  rampguard-version:
    description: The release whose jar to run. Pinned to the version this copy of the action shipped with; override it together with rampguard-sha256.
    default: v1.0.0
  rampguard-sha256:
    description: Expected SHA-256 of that jar. The download is refused if it does not match.
    default: "7f9311010631663b556611fa59db739d0171d2f30fed8d15c0e679ee44dce7e7"

outputs:
  event:
    description: What this run did to the live release. One of advanced, completed, halted, failed, none. A dry run reports none.
    value: ${{ steps.run.outputs.event }}
  release-name:
    description: Name of the live release, or empty.
    value: ${{ steps.run.outputs.release-name }}
  version-codes:
    description: Version codes of the live release, comma-separated, or empty.
    value: ${{ steps.run.outputs.version-codes }}
  from-percent:
    description: On advanced and completed, the rollout percentage before the step.
    value: ${{ steps.run.outputs.from-percent }}
  to-percent:
    description: On advanced and completed, the rollout percentage after the step.
    value: ${{ steps.run.outputs.to-percent }}
  reason:
    description: On halted, why.
    value: ${{ steps.run.outputs.reason }}
  source:
    description: On halted, who or what asked.
    value: ${{ steps.run.outputs.source }}
  ready-to-publish:
    description: Name of a release that Play review approved and a person has to publish, or empty.
    value: ${{ steps.run.outputs.ready-to-publish }}
  rejected:
    description: Name of a release that Play review rejected, or empty.
    value: ${{ steps.run.outputs.rejected }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: "21"

    - name: Download rampguard
      shell: bash
      env:
        VERSION: ${{ inputs.rampguard-version }}
        SHA256: ${{ inputs.rampguard-sha256 }}
      run: |
        set -euo pipefail
        jar="$RUNNER_TEMP/rampguard.jar"
        curl -sSfL --retry 3 -o "$jar" \
          "https://github.com/savvasg28/Rampguard/releases/download/${VERSION}/rampguard-all.jar"
        echo "${SHA256}  ${jar}" | sha256sum -c - >/dev/null || {
          echo "::error::rampguard jar checksum mismatch for ${VERSION}; refusing to run it" >&2
          exit 1
        }
        echo "RAMPGUARD_JAR=$jar" >> "$GITHUB_ENV"

    - name: Prepare Play credentials
      if: inputs.play-credentials != ''
      shell: bash
      env:
        PLAY_CREDENTIALS: ${{ inputs.play-credentials }}
      run: |
        set -euo pipefail
        umask 077
        file="$RUNNER_TEMP/play-credentials.json"
        printf '%s' "$PLAY_CREDENTIALS" > "$file"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$file" >> "$GITHUB_ENV"
        echo "::add-mask::$PLAY_CREDENTIALS"

    - name: Run rampguard
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        CONFIG: ${{ inputs.config }}
        VERSION_CODE: ${{ inputs.version-code }}
        REASON: ${{ inputs.reason }}
        SOURCE: ${{ inputs.source || github.actor }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=("$COMMAND" --config "$CONFIG")
        if [ "$DRY_RUN" = "true" ] && [ "$COMMAND" != "status" ] && [ "$COMMAND" != "validate" ]; then
          args+=(--dry-run)
        fi
        if [ "$COMMAND" = "halt" ]; then
          VERSION_CODE="$(printf '%s' "$VERSION_CODE" | tr -cd '0-9')"
          [ -n "$VERSION_CODE" ] || { echo "::error::halt needs version-code" >&2; exit 2; }
          args+=(--version-code "$VERSION_CODE" --reason "$REASON" --source "$SOURCE")
        fi
        java -jar "$RAMPGUARD_JAR" "${args[@]}"

    - name: Remove Play credentials
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/play-credentials.json"
