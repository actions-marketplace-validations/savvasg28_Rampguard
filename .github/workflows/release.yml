# Builds the fat jar, uploads it with its SHA-256 to the single `v1` release, pins the checksum in action.yml,
# commits that pin to main and moves the `v1` tag to it. Run it from the Actions tab with a version such as 0.2.0;
# the version goes into the release notes and the commit message.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being released, for example 0.2.0 (the release and tag stay v1)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build
        run: ./gradlew check :cli:shadowJar --no-daemon
      - name: Checksum
        id: sum
        run: |
          cd cli/build/libs
          sha256sum rampguard-all.jar | tee rampguard-all.jar.sha256
          echo "sha256=$(cut -d' ' -f1 rampguard-all.jar.sha256)" >> "$GITHUB_OUTPUT"
      - name: Pin the checksum in action.yml
        env:
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          sed -i -E "s/^(    default: \")[0-9a-f]{64}(\")$/\1${SHA256}\2/" action.yml
          grep -q "$SHA256" action.yml
      - name: Commit the pin and move the v1 tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in [0-9]*) ;; *) echo "::error::version must look like 0.2.0, got '$VERSION'"; exit 2 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "Release $VERSION: pin the jar checksum" || echo "checksum unchanged"
          git push origin HEAD:main
          git tag -f v1
          git push -f origin v1
      - name: Upload the jar to the v1 release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view v1 >/dev/null 2>&1 || gh release create v1 --title v1 --notes "Rampguard $VERSION"
          gh release upload v1 cli/build/libs/rampguard-all.jar cli/build/libs/rampguard-all.jar.sha256 --clobber
          gh release edit v1 --notes "Rampguard $VERSION. Steps a Google Play staged rollout one stage per scheduled run and halts it on command. Stateless; no server."
