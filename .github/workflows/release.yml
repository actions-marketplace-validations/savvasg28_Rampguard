# Builds the fat jar and attaches it, with its SHA-256, to a GitHub Release.
# Run it from the Actions tab with a version such as v0.1.0; the workflow creates that tag at the commit it built.
# Pushing a tag v* by hand also works. Then pin the printed checksum in action.yml (see README, Releasing).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, for example v0.1.0
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Build
        run: ./gradlew check :cli:shadowJar --no-daemon
      - name: Checksum
        id: sum
        run: |
          cd cli/build/libs
          sha256sum rampguard-all.jar | tee rampguard-all.jar.sha256
          echo "sha256=$(cut -d' ' -f1 rampguard-all.jar.sha256)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::version must look like v0.1.0, got '$TAG'"; exit 2 ;; esac
          gh release create "$TAG" cli/build/libs/rampguard-all.jar cli/build/libs/rampguard-all.jar.sha256 \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "::notice::rampguard-all.jar sha256 ${{ steps.sum.outputs.sha256 }}; pin it in action.yml for $TAG"
