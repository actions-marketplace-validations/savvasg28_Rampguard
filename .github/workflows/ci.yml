name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build, test, lint and verify coverage
        run: ./gradlew check koverXmlReport --no-daemon --stacktrace
      - name: Validate the example configuration against the parser
        run: ./gradlew :cli:run --no-daemon -q --args="validate --config examples/rampguard.yml"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            build/reports/kover/
          if-no-files-found: ignore
